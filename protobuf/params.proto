syntax = "proto3";

package params;

message HybridAStarGCost{
    double reverse_cost = 1;
    double head_change_cost = 2;
}

message HybridAStarParams{
    int32 max_iter = 1;
    double expand_s = 2;
    int32 expand_step_num = 3;
    double max_steer_angle = 4;
    int32 search_front_num = 5;
    int32 search_back_num = 6;
    double rs_radius = 7;
    double rs_step_size = 8;
    double wheel_base = 9;
    double node_resolution_x = 10;
    double node_resolution_y = 11;
    double node_resolution_theta = 12;
    HybridAStarGCost g_cost = 13;
}

message PiecewiseJerkParams {
    double max_iter = 1;
    double min_v = 2;
    double max_v = 3;
    double min_acc = 4;
    double max_acc = 5;
    double w_jerk = 6;
    double w_acc = 7;
    double w_s_ref = 8;
    double w_v_ref = 9;
    double w_s_end = 10;
    double w_v_end = 11;
    double w_a_end = 12;
}

message OBCAParams {
    double ref_weight = 1;
    double smooth_weight = 2;
    double control_weight = 3;
    int32 ipopt_max_iter = 4;
    double ipopt_tol = 5;
    double ipopt_acceptable_tol = 6;
    int32 ipopt_acceptable_iter = 7;
    string linear_solver = 8;
}

message RDAParams {
    int32 max_iter = 1;
    double convergence_tolerance = 2; // legacy endpoint tolerance; new endpoint_* fields take precedence
    double penalty_weight = 3;   // ro1 in ADMM
    bool use_warm_start = 4;
    double l1_weight = 5;        // slack gain for safety distance
    double w_s = 6;
    double w_u = 7;
    double ro2 = 8;              // second ADMM penalty weight
    optional double min_sd = 9;  // initial safety-distance lower bound (m), default 0.1; zero is valid
    optional double max_sd = 10; // safety-distance upper bound (m), default 1.0
    double dt_min = 11;          // minimum time interval
    double dt_max = 12;          // maximum time interval
    double w_dt = 13;            // weight for dt regularization
    double iter_threshold = 14;  // ADMM early-stop residual threshold
    reserved 15;
    optional double endpoint_position_tolerance = 16; // final x/y box half-width (m), >= 0; default 0.1
    optional double endpoint_heading_tolerance = 17; // final heading box half-width (rad), >= 0; default 0.1
    optional double safety_distance_step = 18; // lower-bound increment (m), >= 0; default 0.1, zero disables adaptation
    optional double safety_distance_cap = 19; // adaptive lower-bound cap (m), default 0.25; clamped to [min_sd, max_sd]
    int32 workers = 21; // 0/1: serial; >1: persistent worker threads for obstacle SOCPs
    int32 worker_timeout_ms = 22; // per ADMM round; 0 uses 5000 ms
    optional int32 safety_distance_persist = 20; // consecutive colliding iterations before raising; >= 1, default 1
}

// OCEAN parameters are independent of RDA. Optional fields preserve explicit zero.
message OCEANParams {
    optional int32 max_iter = 1;
    optional double rho = 2;
    optional double primal_tolerance = 3; // sum of squared physical equality residuals
    optional double step_tolerance = 4;
    optional double w_state = 5;
    optional double w_control = 6;
    optional double w_state_diff = 7;
    optional double w_control_diff = 8;
    optional double w_distance = 9;
    optional double dt_min = 10;
    optional double dt_max = 11;
    optional double endpoint_position_tolerance = 12;
    optional double endpoint_heading_tolerance = 13;
    optional double min_clearance = 14;
    optional int32 max_inner_iter = 15;
    optional double inner_tolerance = 16;
    optional int32 max_sqp_iter = 17;
    optional double trust_region = 18;
    optional double dynamics_tolerance = 19;
    optional int32 workers = 20; // 0/1 serial
    optional int32 worker_timeout_ms = 21;
    optional double time_limit = 22; // total solver.run budget in seconds
}

message SolverParams {
    double max_iter = 1;
    double map_resolution = 2;
    HybridAStarParams hybrid_a_star_param = 3;
    PiecewiseJerkParams piesewise_jerk_params = 4;
    OBCAParams obca_params = 5;
    RDAParams rda_params = 6;
    string backend_solver = 7;
    double dt = 8;
    OCEANParams ocean_params = 9;
}
