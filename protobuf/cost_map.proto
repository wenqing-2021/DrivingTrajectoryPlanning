syntax = "proto3";

package cost_map;

message Point {
    double x = 1;
    double y = 2;
    double risk = 3;
}

message Index {
    int32 idx_x = 1;
    int32 idx_y = 2;
}

message CostMap {
    double min_x = 1;
    double max_x = 2;
    double min_y = 3;
    double max_y = 4;
    double resolution = 5;
    repeated Point points = 6;
    repeated Index idx = 7;
}