[project]
name = "driving-trajectory-planning"
version = "0.1.0"
description = "Trajectory planning methods for automated parking and urban driving"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "bokeh>=3.1,<4",
    "commonroad-io==2023.3",
    "commonroad-route-planner==2022.3",
    "matplotlib>=3.5.2,<3.8",
    "numpy>=1.21,<2",
    "pillow>=9.1",
    "protobuf>=5.29.6,<6",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "black==26.3.1",
    "clang-format==18.1.8",
    "cmake>=3.23,<4",
    "conan>=2,<3",
    "mypy-protobuf==3.6.0",
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
]

[tool.uv]
# CommonRoad 2023.3 pins protobuf 3.20.1, which has known DoS vulnerabilities.
# The Urban integration uses its XML reader directly, avoiding legacy protobuf
# stubs in its format-dispatching reader. Park uses CMake-generated stubs.
override-dependencies = ["protobuf>=5.29.6,<6"]
# Security floors for transitive dependencies of CommonRoad, Bokeh, and Conan.
constraint-dependencies = [
    "lxml>=6.1.0",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(build|third-party)/"

[tool.pytest.ini_options]
pythonpath = ["src", "build/pybind_modules"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "third-party"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
