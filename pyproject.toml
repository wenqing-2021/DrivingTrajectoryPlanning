[project]
name = "driving-trajectory-planning"
version = "0.1.0"
description = "Trajectory planning methods for automated parking and urban driving"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "bokeh>=3.1,<4",
    "commonroad-io==2023.3",
    "commonroad-route-planner==2022.3",
    "matplotlib>=3.5.2,<3.8",
    "numpy>=1.21,<2",
    "protobuf>=3.20,<4",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "clang-format==18.1.8",
    "cmake>=3.23,<4",
    "conan>=2,<3",
    "mypy-protobuf==3.0.0",
    "pytest>=7,<9",
    "ruff>=0.6,<1",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(build|third-party)/"

[tool.pytest.ini_options]
pythonpath = ["src", "build/pybind_modules"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "third-party"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
