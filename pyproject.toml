[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "/(build|third-party)/"

[tool.pytest.ini_options]
pythonpath = ["src", "build/pybind_modules"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "third-party"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
